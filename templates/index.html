<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>font_thing — STL generator</title>
<script>
  // apply theme before first paint to avoid a flash of the wrong theme
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8; --fg: #16171a; --panel-bg: #ffffff; --border: #0000001f;
    --input-bg: #ffffff; --input-fg: #16171a; --muted: #00000088;
    --error-bg: #fee; --error-fg: #900; --error-border: #c99;
    --preview-bg: #00000010;
  }
  :root[data-theme="dark"] {
    --bg: #15171c; --fg: #e8e8ea; --panel-bg: #1d2026; --border: #ffffff26;
    --input-bg: #262a32; --input-fg: #e8e8ea; --muted: #ffffff77;
    --error-bg: #3a1717; --error-fg: #ff8f8f; --error-border: #6b2a2a;
    --preview-bg: #ffffff10;
  }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: var(--bg); color: var(--fg); }
  h1 { font-size: 1.4rem; }
  .top-row { display: flex; justify-content: space-between; align-items: center; }
  #theme-toggle { margin-top: 0; padding: 0.4rem 0.7rem; font-size: 1rem; background: var(--panel-bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
  fieldset { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1rem; background: var(--panel-bg); }
  label { display: block; margin: 0.6rem 0 0.2rem; font-size: 0.9rem; }
  input[type=number], input[type=text], select {
    width: 100%; padding: 0.4rem; box-sizing: border-box;
    background: var(--input-bg); color: var(--input-fg); border: 1px solid var(--border); border-radius: 4px;
  }
  .row { display: flex; gap: 1rem; }
  .row > div { flex: 1; }
  .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem; }
  .checkbox-row input { width: auto; }
  button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
  .error { background: var(--error-bg); color: var(--error-fg); border: 1px solid var(--error-border); border-radius: 6px; padding: 0.6rem; margin-bottom: 1rem; }
  #spike-options { display: none; padding-left: 1rem; border-left: 2px solid var(--border); margin-top: 0.4rem; }
  .upload-row { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.6rem; }
  .upload-row input[type=file] { flex: 1; color: var(--fg); }
  .upload-row button { margin-top: 0; padding: 0.4rem 0.8rem; }
  #svg-preview-wrap { margin-top: 0.6rem; text-align: center; background: var(--preview-bg); border-radius: 6px; padding: 0.6rem; }
  #svg-preview { max-width: 100%; max-height: 260px; }
</style>
</head>
<body>
<div class="top-row">
  <h1>font_thing — generate STLs</h1>
  <button id="theme-toggle" type="button" onclick="toggleTheme()" title="Toggle light/dark theme">&#9680;</button>
</div>
<script>
  function toggleTheme() {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
  }
</script>

{% if error %}<div class="error">{{ error }}</div>{% endif %}

<form action="/generate" method="post">
  <fieldset>
    <legend>SVG</legend>
    {% if svgs %}
    <label for="svg">Input SVG</label>
    <select name="svg" id="svg" required onchange="document.getElementById('svg-preview').src = '/svgs/' + this.value">
      {% for svg in svgs %}
      <option value="{{ svg }}" {% if svg == selected %}selected{% endif %}>{{ svg }}</option>
      {% endfor %}
    </select>
    <div id="svg-preview-wrap">
      <img id="svg-preview" src="/svgs/{{ selected if selected in svgs else svgs[0] }}" alt="SVG preview">
    </div>
    {% else %}
    <p style="color: var(--muted); margin: 0.4rem 0 0;">No SVGs found — upload one below to get started.</p>
    {% endif %}
  </fieldset>

  <fieldset>
    <legend>Upload a new SVG</legend>
    <div class="upload-row">
      <input type="file" name="svg_file" id="svg_file" accept=".svg" form="upload-form">
      <button type="submit" form="upload-form">Upload</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Dimensions</legend>
    <div class="row">
      <div>
        <label for="thickness">Thickness (mm)</label>
        <input type="number" step="0.1" name="thickness" id="thickness" value="2.0">
      </div>
      <div>
        <label for="height">Height (mm)</label>
        <input type="number" step="0.1" name="height" id="height" value="10.0">
      </div>
      <div>
        <label for="cutout_depth">Cutout depth (mm)</label>
        <input type="number" step="0.1" name="cutout_depth" id="cutout_depth" value="3.0">
      </div>
    </div>
    <label for="fn">Round corner resolution (fn)</label>
    <input type="number" step="1" name="fn" id="fn" value="64">
    <div class="checkbox-row">
      <input type="checkbox" name="flip" id="flip">
      <label for="flip" style="margin:0;">Flip (face-down printing)</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Spike</legend>
    <div class="checkbox-row">
      <input type="checkbox" name="spike" id="spike" onchange="document.getElementById('spike-options').style.display = this.checked ? 'block' : 'none'">
      <label for="spike" style="margin:0;">Attach spike (uses spike.stl, or a generated default)</label>
    </div>
    <div id="spike-options">
      <div class="row">
        <div>
          <label for="spike_length">Spike length (mm)</label>
          <input type="number" step="1" name="spike_length" id="spike_length" value="150">
        </div>
        <div>
          <label for="spike_width">Spike width (mm, blank = default)</label>
          <input type="number" step="0.1" name="spike_width" id="spike_width" placeholder="default">
        </div>
      </div>
    </div>
  </fieldset>

  <button type="submit" {% if not svgs %}disabled title="Upload an SVG first"{% endif %}>Generate</button>
</form>

<form id="upload-form" action="/upload" method="post" enctype="multipart/form-data" style="display:none;"></form>
</body>
</html>
